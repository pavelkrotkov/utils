name: Swift

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "TranscriptionLauncher/**"
      - ".github/workflows/swift.yml"
      - ".github/workflows/transcription-release.yml"
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "TranscriptionLauncher/**"
      - ".github/workflows/swift.yml"
      - ".github/workflows/transcription-release.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Parse Swift sources
        run: |
          swiftc -frontend -parse -enable-bare-slash-regex TranscriptionLauncher/Package.swift \
            TranscriptionLauncher/Sources/*/*.swift \
            TranscriptionLauncher/Tests/*/*.swift

  macos:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'ready_for_review' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-15
    defaults:
      run:
        working-directory: TranscriptionLauncher
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test
        run: swift test
      - name: Assemble app bundle
        run: APP_ARCH=arm64 APP_VERSION=0.1.0 Scripts/make-app.sh
      - name: Verify bundle
        run: |
          plutil -lint dist/TranscriptionLauncher.app/Contents/Info.plist
          test -f dist/TranscriptionLauncher.app/Contents/Resources/AppIcon.icns
          codesign --verify --strict dist/TranscriptionLauncher.app
          test "$(lipo -archs dist/TranscriptionLauncher.app/Contents/MacOS/TranscriptionLauncher)" = arm64
          cmp ../LICENSE dist/TranscriptionLauncher.app/Contents/Resources/LICENSE
          for script in audio_transcribe_openai.sh audio_transcribe_whisper.py audio_transcribe_vibevoice.py audio_cloud_chunks.py audio_common.py audio_segments.py audio_transcript.py; do
            cmp "../$script" "dist/TranscriptionLauncher.app/Contents/Resources/Scripts/$script"
          done
