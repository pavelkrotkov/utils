name: Swift

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "TranscriptionLauncher/**"
      - ".github/workflows/swift.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "TranscriptionLauncher/**"
      - ".github/workflows/swift.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Parse Swift sources
        run: |
          swiftc -frontend -parse -enable-bare-slash-regex TranscriptionLauncher/Package.swift \
            TranscriptionLauncher/Sources/*/*.swift \
            TranscriptionLauncher/Tests/*/*.swift

  macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    defaults:
      run:
        working-directory: TranscriptionLauncher
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test
        run: swift test
      - name: Assemble app bundle
        run: Scripts/make-app.sh
      - name: Verify bundle
        run: |
          plutil -lint dist/TranscriptionLauncher.app/Contents/Info.plist
          test -f dist/TranscriptionLauncher.app/Contents/Resources/AppIcon.icns
          codesign --verify --strict dist/TranscriptionLauncher.app
