name: TranscriptionLauncher Release

on:
  push:
    tags: ["transcription-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify version and release credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^transcription-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo 'Expected transcription-vMAJOR.MINOR.PATCH tag' >&2; exit 1; }
          echo "APP_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_CODESIGN_IDENTITY APPLE_NOTARY_APPLE_ID APPLE_NOTARY_PASSWORD APPLE_TEAM_ID; do
            [[ -n "${!name}" ]] || { echo "Missing release secret: $name" >&2; exit 1; }
          done
      - name: Swift tests
        run: cd TranscriptionLauncher && swift test
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/transcription-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
      - name: Build signed Apple Silicon app
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          cd TranscriptionLauncher
          APP_ARCH=arm64 APP_VERSION="$APP_VERSION" Scripts/make-app.sh
          APP=dist/TranscriptionLauncher.app
          test "$(lipo -archs "$APP/Contents/MacOS/TranscriptionLauncher")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$APP_VERSION"
          test -x "$APP/Contents/Resources/Scripts/audio_transcribe_openai.sh"
          cmp ../LICENSE "$APP/Contents/Resources/LICENSE"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "dist/TranscriptionLauncher-${APP_VERSION}-macos-arm64.zip"
      - name: Notarize and verify Gatekeeper
        env:
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd TranscriptionLauncher
          APP=dist/TranscriptionLauncher.app
          ZIP="dist/TranscriptionLauncher-${APP_VERSION}-macos-arm64.zip"
          xcrun notarytool submit "$ZIP" --apple-id "$APPLE_NOTARY_APPLE_ID" --password "$APPLE_NOTARY_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          rm "$ZIP"
          ditto -c -k --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="TranscriptionLauncher/dist/TranscriptionLauncher-${APP_VERSION}-macos-arm64.zip"
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" --verify-tag \
            --title "TranscriptionLauncher $APP_VERSION" \
            --notes "macOS 14+ / Apple Silicon. Signed, notarized, and stapled. Includes version-matched MIT transcription scripts; local tools and speech models are installed separately. OpenAI cloud transcription requires explicit consent and may incur charges."
